services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RISK_FEEDS_ENABLED: ${RISK_FEEDS_ENABLED:-true}   # daily public risk feeds; set false in offline networks
      RISK_FEEDS_HOUR: ${RISK_FEEDS_HOUR:-2}            # hour of day (UTC) for the daily run
    depends_on: [mongo]
volumes:
  mongo-data:
