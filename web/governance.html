<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAESTRO-SC · Data Governance</title>
<style>
:root {
  --bg:#f3f5f5; --card:#ffffff; --ink:#14171c; --ink2:#4b5563; --muted:#8a9099; --line:#e3e7e8; --soft:#f6f8f8;
  --accent:#1d6b78; --bronze:#b5651d; --silver:#7b8794; --gold:#b38f00;
  --surface:#fcfcfb; --good:#0ca30c; --good-ink:#006300; --warning:#fab219; --warning-ink:#8a5a00;
  --serious:#ec835a; --critical:#d03b3b; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
header { background:var(--card); display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line) }
header b { font-family:var(--mono); font-size:18px } header span.t { font-size:18px }
header nav { margin-left:auto; display:flex; gap:14px; font-size:12px } header nav a { color:var(--ink2) }
.lab { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2) }
.kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:0; margin:16px 24px; background:var(--card); border:1px solid var(--line) }
.kpi { padding:14px 16px; border-right:1px solid var(--line) } .kpi:last-child { border:0 }
.kpi .v { font-size:26px; font-weight:700; margin:4px 0 } .kpi .s { color:var(--ink2); font-size:12px }
.v.good { color:var(--good-ink) } .v.bad { color:var(--critical) } .v.warn { color:var(--warning-ink) }
.tabs { display:flex; gap:26px; padding:0 24px; border-bottom:1px solid var(--line); overflow-x:auto }
.tabs a { padding:12px 2px; text-decoration:none; color:var(--ink2); font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; border-bottom:2px solid transparent; white-space:nowrap }
.tabs a.on { color:var(--ink); border-color:var(--accent); font-weight:700 }
main { padding:20px 24px 60px }
.card { background:var(--card); border:1px solid var(--line); padding:18px; margin-bottom:16px }
.layers { display:grid; grid-template-columns:1fr auto 1fr auto 1fr auto 1fr; align-items:stretch; gap:10px; margin-bottom:16px }
.layer { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c); padding:16px }
.layer .k { color:var(--c); font-weight:700 } .layer h2 { margin:6px 0; font-size:20px; letter-spacing:.02em }
.layer p { color:var(--ink2); margin:0 0 12px; font-size:13px } .arrow { align-self:center; color:var(--muted); font-size:20px }
.nums { display:flex; gap:22px } .nums b { display:block; font-size:16px } .nums span { color:var(--ink2); font-size:12px }
.grid3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px }
.prod h3 { margin:2px 0 6px; font-size:17px } .prod p { color:var(--ink2); margin:0 0 12px; font-size:13px }
.prod .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px }
.facts { display:grid; grid-template-columns:1fr 1fr; gap:6px } .fact { background:var(--soft); padding:8px 10px }
.fact .lab { font-size:10px } .fact div:last-child { font-weight:600 }
.badge { font-weight:700; padding:3px 10px; border-radius:12px; color:#fff; white-space:nowrap; font-size:13px }
.gA { background:var(--good) } .gB { background:var(--warning); color:#0b0b0b } .gC { background:var(--serious); color:#0b0b0b } .gD { background:var(--critical) }
.pill { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 7px; border:1px solid currentColor; border-radius:2px; text-transform:uppercase }
.p-good { color:var(--good-ink) } .p-warn { color:var(--warning-ink) } .p-bad { color:var(--critical) } .p-muted { color:var(--muted) }
.split { display:grid; grid-template-columns:1fr 1fr; gap:16px } @media (max-width:1000px) { .split, .layers { grid-template-columns:1fr } .arrow { display:none } .kpis { grid-template-columns:repeat(3,1fr) } }
.panel-h { margin:-18px -18px 16px; padding:12px 18px; border-bottom:1px solid var(--line) }
.verdict { font-size:22px; font-weight:800; letter-spacing:.02em; margin:6px 0 10px }
button { font:inherit; padding:7px 14px; border:0; border-radius:3px; color:#fff; background:var(--accent); cursor:pointer; font-weight:600 }
button.ok { background:#1f8a4c } button.mod { background:#1d6b78 } button.ovr { background:var(--critical) } button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent) }
button:disabled { opacity:.45; cursor:default }
input, textarea, select { font:inherit; padding:7px 9px; border:1px solid var(--line); background:#fff; color:var(--ink) }
table { width:100%; border-collapse:collapse; font-size:12.5px } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--muted); font-weight:500 } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums }
.gauge { display:flex; flex-direction:column; align-items:center; padding:10px 0 }
.gauge .num { font-size:44px; font-weight:700; margin-top:-70px } .gauge .sub { color:var(--ink2) }
.seg { display:flex; height:28px; gap:2px; margin:10px 0 } .seg div { border-radius:4px; color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; padding-left:8px; min-width:0; overflow:hidden; white-space:nowrap }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2) } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px }
.mono { font-family:var(--mono); font-size:12px } .muted { color:var(--muted) } .empty { color:var(--muted); padding:16px 0 }
.dims { display:grid; grid-template-columns:repeat(6,1fr); gap:8px } .dims div { background:var(--soft); padding:10px } .dims b { font-size:20px; display:block }
.matrix td { text-align:center; font-weight:600 } .matrix td:first-child { text-align:left }
.user { display:flex; gap:6px; align-items:center }
.log { font:12px var(--mono); white-space:pre-wrap; color:var(--ink2); max-height:220px; overflow:auto }
a.dl { color:inherit; text-decoration:none; border-bottom:1px dashed var(--muted) } a.dl:hover { color:var(--accent); border-color:var(--accent) }
.kpi a.dl { border:0 } .kpi:hover { background:var(--soft) }
.facets { display:grid; grid-template-columns:repeat(5,1fr); gap:12px } .facet h4 { margin:0 0 6px } .facet a { display:flex; justify-content:space-between; padding:3px 6px; text-decoration:none; color:var(--ink); font-size:12.5px; border-radius:3px } .facet a:hover { background:var(--soft) }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center } .chip { background:var(--soft); border:1px solid var(--line); padding:3px 8px; border-radius:12px; font-size:12px } .chip a { margin-left:6px; text-decoration:none; color:var(--muted) }
tr.click { cursor:pointer } tr.click:hover td { background:var(--soft) }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(760px,96vw); background:#fff; border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.12); overflow:auto; padding:20px 24px; z-index:20; display:none }
.drawer.open { display:block } .drawer .x { position:absolute; top:12px; right:16px; background:transparent; color:var(--ink); font-size:20px }
.dimrow { display:grid; grid-template-columns:120px 1fr 60px 50px; gap:10px; align-items:center; margin:4px 0; font-size:12.5px }
.bar { height:8px; background:color-mix(in srgb, var(--accent) 15%, transparent); border-radius:4px; overflow:hidden } .bar i { display:block; height:100%; background:var(--accent); border-radius:4px }
.lineage { display:flex; flex-direction:column; gap:0; margin:8px 0 } .step { border-left:2px solid var(--line); padding:4px 0 10px 14px; position:relative } .step:before { content:""; position:absolute; left:-6px; top:8px; width:10px; height:10px; border-radius:50%; background:var(--c, var(--accent)) }
.step b { font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono) } pre.row { background:var(--soft); padding:8px; font-size:11.5px; overflow:auto; max-height:220px; margin:4px 0 0 }
.tip { position:fixed; pointer-events:none; background:#fff; border:1px solid var(--line); padding:6px 9px; font-size:12px; display:none; box-shadow:0 4px 12px rgba(0,0,0,.12) }
</style>
</head>
<body>
<header><b>MAESTRO-SC</b><span class="t">Data Governance</span>
  <nav><a href="/maestro">Maestro modules</a><a href="/supply">Supply</a><a href="/maestro#config">Configuration</a>
    <span class="user"><label class="lab" for="who">Acting as</label><input id="who" placeholder="Your name / role" style="width:180px"></span></nav></header>
<section class="kpis" id="kpis"></section>
<nav class="tabs" id="tabs">
  <a href="/maestro#config">Load data ↗</a><a href="#overview">Overview</a><a href="#plan">01 Plan &amp; govern</a><a href="#filter">02 Filter &amp; dedup</a>
  <a href="#clean">03 Clean &amp; transform</a><a href="#enrich">04 Enrich &amp; tag</a><a href="#audit">05 Audit &amp; balance</a><a href="#monitor">06 Monitor loop</a>
</nav>
<main id="view"></main>
<div class="tip" id="tip"></div>
<aside class="drawer" id="drawer" aria-label="Record detail"><button class="x" onclick="closeDrawer()" aria-label="Close">×</button><div id="dbody"></div></aside>
<script>
const $ = s => document.querySelector(s);
const esc = v => v == null ? "—" : String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
const dt = v => v ? new Date(v).toLocaleString(undefined, {day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "—";
const api = (p, o) => fetch(p, o).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || r.status); return j; });
const post = (p, body) => api(p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const badge = (g, s) => g ? `<span class="badge g${g}">${g}${s != null ? " " + num(s, 2) : ""}</span>` : `<span class="pill p-muted">no data</span>`;
const certPill = c => `<span class="pill ${c === "CERTIFIED" ? "p-good" : c === "BLOCKED" ? "p-bad" : "p-warn"}">${c === "CERTIFIED" ? "✓ " : c === "BLOCKED" ? "▲ " : "● "}${esc(c)}</span>`;
const GRADE_COLOR = {A: "var(--good)", B: "var(--warning)", C: "var(--serious)", D: "var(--critical)"};
$("#who").value = localStorage.govUser || ""; $("#who").onchange = e => localStorage.govUser = e.target.value.trim();
const who = () => { const u = $("#who").value.trim(); if (!u) { $("#who").focus(); alert("Enter your name or role (top right) first: every governance action is recorded against it."); } return u; };

async function kpis() {
  const o = await api("/api/governance/overview"), k = o.kpis;
  const t = [["Datasets governed", k.datasets_governed, `${k.bronze_datasets} sources · ${k.silver_datasets} silver entities`, ""],
    ["Gold confidence", k.gold_confidence == null ? "—" : num(k.gold_confidence, 1), `avg across ${k.gold_products} products`, k.gold_confidence >= 95 ? "good" : k.gold_confidence >= 85 ? "warn" : "bad"],
    ["Blocked at ingest", num(k.blocked_at_ingest), `of ${num(k.bronze_records)} records`, k.blocked_at_ingest ? "bad" : "good"],
    ["Open alerts", k.open_alerts, "quarantine & drift", k.open_alerts ? "bad" : ""],
    ["Review queue", k.review_queue, "quarantine + decision", k.review_queue ? "warn" : ""],
    ["Drift alerts", k.drift_alerts, "features above threshold", k.drift_alerts ? "bad" : ""]];
  const links = ["#batches", "#drill?gold=1", "#batches?blocked=1", "#drill?layer=quarantine", "#monitor", "#monitor"];
  $("#kpis").innerHTML = t.map(([l, v, s, c], i) => `<a class="kpi dl" href="${links[i]}" title="Open"><div class="lab">${l}</div><div class="v ${c}">${esc(v)}</div><div class="s">${esc(s)}</div></a>`).join("");
  return o;
}

function gauge(score, grade) {
  const W = 220, R = 90, cx = W / 2, cy = 110, a = Math.PI * (1 - Math.max(0, Math.min(100, score || 0)) / 100);
  const arc = (end, color, w) => `<path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R * Math.cos(end)} ${cy - R * Math.sin(end)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
  const color = GRADE_COLOR[grade] || "var(--line)";
  return `<div class="gauge" role="img" aria-label="Data trust ${num(score, 2)} of 100, grade ${grade}"><svg width="${W}" height="130">${arc(0, `color-mix(in srgb, ${color} 20%, white)`, 18)}${score != null ? arc(a, color, 18) : ""}</svg>
    <div class="num">${score == null ? "—" : num(score, 2)}</div><div class="sub">/ 100 · Grade ${esc(grade)}</div></div>`;
}

function decisionPanel(d) {
  const ask = `<form id="askf" style="display:flex;gap:8px;margin-top:14px"><input id="q" style="flex:1" placeholder="Ask about your data, e.g. Which aircraft are at risk of missing AMREP?"><button>Ask</button></form>`;
  if (!d) return `<p class="empty">No open AI answer. Earlier answers are in <a href="#monitor">06 Monitor loop</a>.</p>${ask}`;
  const g = d.gate || {}, a = d.answer || {}, tr = d.data_trust || {};
  const V = {RECOMMEND: "Recommend", RECOMMEND_WITH_CAVEAT: "Recommend with caveat", ADVISORY: "Advisory only", WITHHOLD: "Withheld"}[g.verdict] || g.verdict;
  const actions = (a.recommended_actions || []).map(x => `<li>${esc(x)}</li>`).join("");
  const pending = d.status === "PENDING";
  return `<div class="lab">${esc(d.question)}</div><div class="verdict">${esc(V).toUpperCase()}</div>
    <p style="margin:0 0 6px">${esc(a.answer)}</p>${actions ? `<ul style="margin:4px 0 10px;padding-left:18px">${actions}</ul>` : ""}
    <p class="muted" style="font-size:12px;margin:0 0 10px">${esc(g.reason)}</p>
    <div class="facts"><div class="fact"><div class="lab">Model</div><div>${esc(d.model)}</div></div>
      <div class="fact"><div class="lab">Confidence</div><div>${a.confidence == null ? "—" : Math.round(a.confidence * 100) + "% " + esc((g.confidence_band || "").toUpperCase())}</div></div>
      <div class="fact"><div class="lab">Data trust</div><div>${tr.grade ? esc(tr.grade) + " (" + num(tr.score, 1) + ")" : "—"}</div></div>
      <div class="fact"><div class="lab">Status</div><div>${esc(d.status)}</div></div></div>
    ${(a.evidence || []).length ? `<details style="margin-top:8px"><summary class="muted">Evidence</summary><ul>${a.evidence.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="ok" data-act="accept" ${pending ? "" : "disabled"}>Accept</button>
      <button class="mod" data-act="modify" ${pending ? "" : "disabled"}>Modify</button><button class="ovr" data-act="override" ${pending ? "" : "disabled"}>Override</button>
      <button data-act="clear" style="margin-left:auto;background:transparent;color:var(--ink2);border:1px solid var(--line)" title="Take this answer off the overview; it stays in the decision history">Clear</button></div>${ask}`;
}
function wireDecision(d, rerender) {
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const u = who(); if (!u) return; const act = b.dataset.act; let text = "";
    if (act === "modify") { text = prompt("Modified action:"); if (!text) return; }
    if (act === "override") { text = prompt("Reason for override (required, recorded):"); if (!text) return; }
    if (act === "clear") { text = prompt("Why clear it? (optional, recorded)", "no longer relevant"); if (text === null) return; }
    try { await post(`/api/governance/decisions/${d.id}/${act}`, {user: u, text}); rerender(); } catch (e) { alert(e.message); } });
  const f = $("#askf"); if (f) f.onsubmit = async e => { e.preventDefault(); if (!$("#q").value.trim()) return;
    f.querySelector("button").disabled = true; f.querySelector("button").textContent = "Thinking…";
    try { await post("/api/ask", {question: $("#q").value}); } catch (err) { alert(err.message); } rerender(); };
}

const GATE_COLORS = {silver: "var(--silver)", quarantine: "var(--critical)", duplicate: "var(--muted)", history: "var(--muted)"};
const layerPill = l => `<span class="pill ${l === "silver" ? "p-good" : l === "quarantine" ? "p-bad" : "p-muted"}">${esc(l)}</span>`;
const FACET_NAMES = {record_type: "Entity", layer: "Layer", grade: "Grade", issue: "Issue", source: "Source"};
const PARAM_NAMES = {product: "Product", record_type: "Entity", layer: "Layer", grade: "Grade", issue: "Issue", source: "Source", batch: "Batch", asset: "Asset", gold: "Gold only"};
const withParam = (params, k, v) => { const p = new URLSearchParams(params); if (v == null) p.delete(k); else p.set(k, v); p.delete("skip"); return "#drill?" + p.toString(); };

function closeDrawer() { $("#drawer").classList.remove("open"); }
addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
async function openRecord(id) {
  const d = await api("/api/governance/record/" + id), t = d.trust || {}, L = d.lineage, w = d.weights;
  const dims = Object.keys(w).map(k => { const v = (t.dims || {})[k]; return `<div class="dimrow"><span>${esc(k)}</span><div class="bar"><i style="width:${v || 0}%"></i></div><b>${num(v, 0)}</b><span class="muted">×${w[k]}%</span></div>`; }).join("");
  const issues = (t.issues || []).map(i => `<tr><td>${i.hard ? '<span class="pill p-bad">hard rule</span>' : '<span class="pill p-warn">deduct</span>'}</td><td>${esc(i.dimension)}</td><td class="mono">${esc(i.code)}</td><td>${esc(i.detail)}</td></tr>`).join("");
  const fields = Object.entries(d.fields).map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${esc(typeof v === "string" && /^\d{4}-\d\d-\d\dT/.test(v) ? v.slice(0, 10) : v)}</td></tr>`).join("");
  const attrs = Object.entries(d.attributes || {}).filter(([k]) => !["sheet", "tab_color"].includes(k)).map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${esc(Array.isArray(v) ? v.join("; ") : typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("");
  const src = L.source_row ? `<pre class="row">${esc(L.source_row.sheet_cells ? L.source_row.sheet_cells.map(r => r.map(c => c == null ? "" : c).join(" | ")).join("\n") : JSON.stringify(L.source_row, null, 1))}</pre>` : "";
  $("#dbody").innerHTML = `<div class="lab">${esc(d.record_type)}</div><h2 style="margin:4px 0 8px">${esc(d.fields.asset_id || d.fields.sku || d.fields.order_id || d.fields.shipment_id || d.fields.gate || d.record_type)}</h2>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">${badge(t.grade, t.score)} ${layerPill(d.layer)} ${d.tags && d.tags.sensitivity === "CUI" ? '<span class="pill p-warn">CUI</span>' : ""}
      <span class="muted" style="font-size:12px">${L.gold.included ? "✓ In Gold: " + esc(L.gold.products.join(", ")) : "Not in Gold: " + esc(L.gold.why_not)}</span></div>
    <div class="card"><div class="lab"><b>Data Trust Score</b> · ${num(t.score, 1)} = weighted sum of six dimensions</div>${dims}
      ${issues ? `<table style="margin-top:10px"><tr><th>Effect</th><th>Dimension</th><th>Code</th><th>Detail</th></tr>${issues}</table>` : '<p class="muted">No issues found.</p>'}</div>
    ${d.quarantine ? `<div class="card" style="border-color:var(--critical)"><div class="lab"><b>Quarantine</b> · ${esc(d.quarantine.status)}</div><p style="margin:6px 0"><span class="pill p-bad">${esc(d.quarantine.reason_code)}</span> ${esc(d.quarantine.reason)}</p>
      <p class="muted" style="margin:0;font-size:12px">Steward: ${esc(d.quarantine.steward)} · opened ${dt(d.quarantine.opened_at)} · due ${dt(d.quarantine.due_at)}${d.quarantine.resolution ? " · " + esc(d.quarantine.resolution) : ""}</p></div>` : ""}
    <div class="card"><div class="lab"><b>Lineage</b> · source to decision</div><div class="lineage">
      <div class="step" style="--c:var(--bronze)"><b>Bronze file</b><div>${L.file ? `${esc(L.file.filename)} · ${num(L.file.size)} bytes · <span class="mono">${esc(L.file.sha256.slice(0, 16))}…</span> · ${dt(L.file.received_at)}` : "not uploaded as a file (API / IoT)"}</div></div>
      <div class="step" style="--c:var(--bronze)"><b>Bronze batch</b><div>${esc(L.batch.source_id)}${L.batch.sheet ? " / " + esc(L.batch.sheet) : ""}${L.batch.template ? " · template " + esc(L.batch.template) : ""} · Gate 1 ${esc((L.batch.gate1 || {}).status || "pass")} · <a class="dl" href="#batch?id=${L.batch.batch_id}" onclick="closeDrawer()">open batch</a></div></div>
      <div class="step" style="--c:var(--bronze)"><b>Source row</b><div>${L.row_index != null ? "row " + (L.row_index + 1) + " · " : ""}hash <span class="mono">${esc(L.row_hash)}</span></div>${src}</div>
      <div class="step" style="--c:var(--silver)"><b>Silver record</b><div>${esc(d.layer)} · grade ${esc(t.grade)} (${num(t.score, 1)})${d.cleaning.length ? " · " + d.cleaning.length + " value(s) standardised or rejected" : ""}</div></div>
      <div class="step" style="--c:${L.gold.included ? "var(--gold)" : "var(--line)"}"><b>Gold</b><div>${L.gold.included ? esc(L.gold.products.join(", ")) : "excluded: " + esc(L.gold.why_not)}</div></div></div></div>
    <div class="card"><div class="lab"><b>Fields</b></div><table>${fields}${attrs}</table>
      ${L.batch.mapping ? `<details><summary class="muted">Column mapping used</summary><table>${Object.entries(L.batch.mapping).map(([c, f]) => `<tr><td>${esc(c)}</td><td>→ ${esc(f || "kept as attribute")}</td></tr>`).join("")}</table></details>` : ""}</div>

        <td>${b.balanced ? '<span class="pill p-good">✓ yes</span>' : '<span class="pill p-bad">▲ no</span>'}</td></tr>`).join("")}</table>
      <p class="muted" style="font-size:12px">Replaced = rows superseded when a newer upload of the same tail sheet arrived; the earlier file stays in Bronze.</p></div>
      <div class="card"><div class="lab"><b>Audit log</b></div><table><tr><th>When</th><th>Action</th><th>By</th><th>Detail</th></tr>
      ${s.audit_log.map(a => `<tr><td>${dt(a.at)}</td><td>${esc(a.action)}</td><td>${esc(a.user)}</td><td class="mono" style="font-size:11px">${esc(JSON.stringify(a.detail))}</td></tr>`).join("")}</table></div>`;
  },
  async monitor(v, o) {
    const s = await api("/api/governance/stage/monitor"), m = s.monitor, mix = o.layers.silver.grade_mix || {}, total = Object.values(mix).reduce((a, b) => a + b, 0) || 1;
    const seg = ["A", "B", "C", "D"].filter(g => mix[g]).map(g => { const pct = 100 * mix[g] / total;
      return `<div onclick="location.hash='#drill?grade=${g}'" style="cursor:pointer;flex:${mix[g]};background:${GRADE_COLOR[g]};${g === "B" || g === "C" ? "color:#0b0b0b" : ""}" title="Grade ${g}: ${mix[g]} records (${pct.toFixed(1)}%) - click to open">${pct >= 8 ? g + " " + pct.toFixed(0) + "%" : ""}</div>`; }).join("");
    const tile = (l, v, target, ok) => `<div class="kpi" style="border:1px solid var(--line);background:#fff"><div class="lab">${l}</div><div class="v ${ok == null ? "" : ok ? "good" : "bad"}">${esc(v)}</div><div class="s">${esc(target)}</div></div>`;
    v.innerHTML = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
      ${tile("Records grade A/B", m.gold_ab_pct == null ? "—" : num(m.gold_ab_pct, 1) + "%", `target ≥ ${m.gold_target_pct}%`, m.gold_ab_pct == null ? null : m.gold_ab_pct >= m.gold_target_pct)}
      ${tile("Quarantine aging", num(m.quarantine_avg_age_days, 1) + " days", `target < 5 days · ${m.quarantine_overdue} overdue`, m.quarantine_overdue === 0)}
      ${tile("Acceptance rate", m.acceptance_rate == null ? "—" : num(m.acceptance_rate, 1) + "%", "AI recommendations accepted", null)}
      ${tile("Override rate", m.override_rate == null ? "—" : num(m.override_rate, 1) + "%", "every override carries a reason", null)}</div>
      <div class="card"><div class="lab"><b>Grade mix</b> · current records in Silver and quarantine</div><div class="seg" role="img" aria-label="Grade mix">${seg}</div>
      <div class="legend">${["A", "B", "C", "D"].map(g => `<a class="dl" href="#drill?grade=${g}"><i style="background:${GRADE_COLOR[g]}"></i>${g} · ${num(mix[g] || 0)}</a>`).join("")}</div></div>
      <div class="card"><div class="lab"><b>Quarantine</b> · fixed at the source, never edited in place</div><table><tr><th>Entity</th><th>Key</th><th>Reason</th><th>Steward</th><th class="n">Age</th><th>Due</th><th></th></tr>
      ${s.quarantine.map(q => `<tr><td>${esc(q.record_type)}</td><td><a class="dl" href="javascript:openRecord('${q.record_id}')">${esc(q.key)}</a></td><td><span class="pill p-bad">${esc(q.reason_code)}</span> ${esc(q.reason)}</td><td>${esc(q.steward)}</td><td class="n">${q.age_days} d</td>
        <td>${q.overdue ? '<span class="pill p-bad">▲ overdue</span>' : dt(q.due_at)}</td><td><button class="ghost" data-close="${q.id}">Close</button></td></tr>`).join("") || '<tr><td colspan=7 class="empty">Quarantine is empty</td></tr>'}</table></div>
      <div class="card"><div class="lab"><b>Drift alerts</b> · newest batch vs earlier batches</div><table><tr><th>Entity</th><th>Field</th><th class="n">Previous mean</th><th class="n">Current mean</th><th class="n">Change</th></tr>
      ${s.drift.map(d => `<tr><td>${esc(d.record_type)}</td><td>${esc(d.field)}</td><td class="n">${num(d.previous_mean, 2)}</td><td class="n">${num(d.current_mean, 2)}</td><td class="n">${d.change_pct > 0 ? "+" : ""}${num(d.change_pct, 1)}%</td></tr>`).join("") || '<tr><td colspan=5 class="empty">No drift above threshold</td></tr>'}</table></div>
      <div class="card"><div class="lab"><b>AI decisions</b></div><table><tr><th>When</th><th>Question</th><th>Gate</th><th>Data</th><th>Status</th><th>By</th><th>Note</th></tr>
      ${s.decisions.map(d => `<tr><td>${dt(d.created_at)}</td><td>${esc(d.question)}</td><td>${esc((d.gate.verdict || "").replaceAll("_", " ").toLowerCase())}</td><td>${esc(d.data_trust.grade)}</td><td>${esc(d.status)}${d.archived ? `<div class="muted" style="font-size:11px">cleared: ${esc(d.archived_reason)}</div>` : ""}</td><td>${esc(d.decided_by)}</td><td>${esc(d.decision_note)}</td></tr>`).join("") || '<tr><td colspan=7 class="empty">No decisions yet</td></tr>'}</table></div>`;
    document.querySelectorAll("[data-close]").forEach(b => b.onclick = async () => { const u = who(); if (!u) return;
      const r = prompt("Resolution (e.g. 'corrected in source system, re-ingest scheduled'):"); if (!r) return;
      try { await post(`/api/governance/quarantine/${b.dataset.close}/close`, {user: u, resolution: r}); route(); } catch (e) { alert(e.message); } });
  },
};

async function route() {
  const [key0, params = ""] = location.hash.slice(1).split("?"), key = key0 || "overview";
  closeDrawer();
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + key));
  try { const o = await kpis();
    await (VIEWS[key] || VIEWS.overview)($("#view"), o, params); }
  catch (e) { $("#view").innerHTML = `<p class="empty">Could not load (${esc(e.message)}).</p>`; }
}
addEventListener("hashchange", route); route();
</script>
<script>
// Signed-in operator: name, sign out, and links to modules this account can't open are removed.
(async () => {
  const r = await fetch("/api/auth/me"); if (!r.ok) return; const me = await r.json();
  const mod = {"/supply": "supply", "/governance": "governance", "/maestro#config": "configuration", "#": "ai"};
  document.querySelectorAll("nav a").forEach(a => { const m = mod[a.getAttribute("href")]; if (m && !(me.modules || []).includes(m)) a.remove(); });
  if (!me.username) return;
  const nav = document.querySelector("nav");
  nav.insertAdjacentHTML("beforeend", `<a href="/maestro#account" title="Your account">${me.display_name || me.username}</a><a href="#" id="signout">Sign out</a>`);
  document.getElementById("signout").onclick = async e => { e.preventDefault(); await fetch("/api/auth/logout", {method: "POST"}); location.href = "/login"; };
})();
</script>
</body>
