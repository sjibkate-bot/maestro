<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAESTRO-SC</title>
<style>
:root {
  --paper:#edebe7; --panel:#e2dfda; --card:#f6f5f2; --ink:#14171c; --ink2:#4b4f57; --muted:#80838a;
  --line:#c9c5bd; --accent:#1d6b78; --accent-ink:#ffffff; --hover:#d8d4cd;
  /* chart tokens (validated palette) */
  --surface:#fcfcfb; --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#86b6ef; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --paper:#0f1115; --panel:#161a20; --card:#1b2028; --ink:#eef0f3; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c323c; --accent:#22c3d6; --accent-ink:#0b0d10; --hover:#232a33;
  --surface:#1a1a19; --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --s3:#199e70;
}
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 var(--sans) }
a { color:inherit }
.mono { font-family:var(--mono); letter-spacing:.12em; text-transform:uppercase; font-size:11px }
header { display:flex; align-items:center; gap:20px; padding:12px 24px; border-bottom:1px solid var(--line) }
.logo { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-weight:700; font-size:17px; letter-spacing:.02em; text-decoration:none }
.logo i { width:22px; height:22px; background:var(--accent); display:grid; place-items:center; color:var(--accent-ink); font-style:normal; font-size:11px }
header .sep { width:1px; height:26px; background:var(--line) }
.search { border:1px solid var(--ink2); padding:6px 12px; min-width:260px; background:transparent; color:var(--ink); font-family:var(--mono); font-size:12px; letter-spacing:.08em }
nav { margin-left:auto; display:flex; gap:4px; flex-wrap:wrap }
nav a { text-decoration:none; padding:6px 10px; border:1px solid transparent }
nav a.on { border-color:var(--accent); color:var(--accent) }
.alertbar { padding:8px 24px; border-bottom:1px solid var(--critical); color:var(--critical); display:flex; gap:10px; align-items:center }
.alertbar .dot { width:7px; height:7px; border-radius:50%; background:var(--critical) }
.alertbar span.n { color:var(--ink2) }
main { max-width:1320px; margin:0 auto; padding:28px 24px 80px }
.eyebrow { color:var(--accent); font-weight:700 }
h1 { font-size:38px; line-height:1.05; margin:6px 0 4px; letter-spacing:-.02em; font-weight:800 }
.titlebar { display:flex; align-items:flex-end; justify-content:space-between; border-left:2px solid var(--line); padding-left:24px; margin-bottom:24px }
.ready { text-align:right } .ready b { display:block; color:var(--accent); font-family:var(--mono); font-size:20px; letter-spacing:.05em }
.grid4 { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line) }
.mod { background:var(--panel); padding:24px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:180px; text-decoration:none; display:block; position:relative }
.mod:hover { background:var(--hover) }
.mod .ic { width:36px; height:36px; border:1px solid var(--accent); color:var(--accent); display:grid; place-items:center; font-family:var(--mono); font-size:12px }
.mod .id { position:absolute; top:24px; right:24px; color:var(--muted) }
.mod h3 { margin:28px 0 8px; font-size:15px; letter-spacing:.08em; text-transform:uppercase }
.mod p { margin:0; color:var(--ink2); font-size:13px }
.badge { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:2px 6px; border:1px solid var(--line); color:var(--muted); margin-top:10px }
.badge.live { border-color:var(--accent); color:var(--accent) }
.panel { background:var(--panel); border:1px solid var(--line); padding:20px; margin-bottom:20px }
.panel h2 { margin:0 0 14px; font-size:13px } .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center }
select, input, button, textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); padding:7px 10px }
button { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); cursor:pointer; font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase }
.docks { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px }
.dock { background:var(--card); border:1px solid var(--line); padding:18px; display:grid; gap:12px }
.dock .top { display:flex; justify-content:space-between; gap:12px }
.dock .name { font-size:30px; font-weight:300; letter-spacing:.02em; text-transform:uppercase }
.dock .box { border:1px solid var(--ink2); padding:6px 10px; font-family:var(--mono); font-size:11px; display:grid; grid-template-columns:auto auto; gap:2px 14px; height:max-content }
.dock .box b { text-align:right } .over { color:var(--critical) }
.dock .line { font-weight:600; font-size:15px }
.dock .cols { display:grid; grid-template-columns:90px 1fr; gap:14px; font-size:12px }
.dock .ms div { margin-bottom:8px } .dock .ms u { font-weight:700; font-size:11px; display:block }
.dock ul { margin:4px 0 0; padding-left:16px; color:var(--ink2) }
.tag { font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 6px; border:1px solid currentColor; display:inline-flex; gap:5px; align-items:center }
.tag.critical { color:var(--critical) } .tag.warning { color:#b07a00 } :root[data-theme="dark"] .tag.warning { color:var(--warning) }
.tag.good { color:var(--good) } .tag.serious { color:#b8532c } :root[data-theme="dark"] .tag.serious { color:var(--serious) }
/* charts */
.viz { background:var(--surface); border:1px solid var(--line); padding:16px 16px 8px; position:relative }
.viz h3 { margin:0; font-size:18px } .viz .sub { color:var(--ink2); margin-bottom:6px }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin:6px 0 }
.legend span { display:inline-flex; align-items:center; gap:6px }
.key-rect { width:12px; height:12px; border-radius:2px; display:inline-block } .key-line { width:16px; height:2px; display:inline-block }
svg text { fill:var(--muted); font:11px var(--sans) } svg .lab { fill:var(--ink2); font-weight:600 }
.tip { position:fixed; pointer-events:none; background:var(--card); border:1px solid var(--line); padding:8px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.15); display:none; z-index:10; min-width:150px }
.tip b { font-size:14px; color:var(--ink) } .tip div { color:var(--ink2) }
table { border-collapse:collapse; width:100%; font-size:12px } th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left }
th { color:var(--muted); font-weight:500 } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums }
details summary { cursor:pointer; color:var(--ink2); margin:8px 0; font-size:12px }
.split { display:grid; grid-template-columns:3fr 1fr; gap:16px } @media (max-width:900px) { .split { grid-template-columns:1fr } }
.fleet { display:grid; grid-template-columns:220px 1fr; gap:16px }
.rail a { display:flex; justify-content:space-between; padding:8px 10px; border-bottom:1px solid var(--line); text-decoration:none; font-family:var(--mono); font-size:12px }
.rail a.on { background:var(--card); border-left:2px solid var(--accent) }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px }
.stat { background:var(--card); border:1px solid var(--line); padding:12px } .stat .v { font-size:26px; font-weight:600 } .stat .l { color:var(--muted) }
.meter { height:8px; background:color-mix(in srgb, var(--s1) 20%, transparent); border-radius:4px; overflow:hidden; margin-top:6px } .meter i { display:block; height:100%; background:var(--s1); border-radius:4px }
.log { font:12px var(--mono); white-space:pre-wrap; color:var(--ink2); max-height:200px; overflow:auto }
.themebtn { background:transparent; color:var(--ink); border-color:var(--line) }
.empty { color:var(--muted); padding:20px 0 }
dialog { background:var(--card); color:var(--ink); border:1px solid var(--critical); padding:22px; max-width:560px; width:92vw }
dialog::backdrop { background:rgba(0,0,0,.55) } dialog h2 { margin:0 0 10px; font-size:18px } dialog label { display:block; margin:10px 0 4px; font-size:12px; color:var(--ink2) }
dialog input { width:100% } dialog ul { margin:6px 0; padding-left:18px; color:var(--ink2) }
button.danger { background:var(--critical); border-color:var(--critical); color:#fff } button.plain { background:transparent; color:var(--ink); border-color:var(--line) }
button:disabled { opacity:.4; cursor:not-allowed }
</style>
</head>
<body>
<header>
  <a class="logo" href="#modules"><i>M</i>MAESTRO-SC</a><span class="sep"></span>
  <input class="search" id="search" placeholder="SEARCH_SYSTEM...  [Ctrl+K]" aria-label="Search tail number">
  <nav class="mono" id="nav">
    <a href="#modules">Modules</a><a href="#amxg">AMXG</a><a href="/supply">Supply</a><a href="#docks">Docks</a><a href="#gates">Gates</a><a href="#machine">Machine</a>
    <a href="#fleet">Fleet</a><a href="#alerts">Alerts</a><a href="/governance">Governance</a><a href="#config">Configuration</a>
  </nav>
  <button id="theme" class="mono themebtn" aria-label="Toggle paper or dark mode">Paper</button>
</header>
<div class="alertbar mono" id="alertbar"><span class="dot"></span><a href="#alerts" id="alerttext">Loading alerts…</a></div>
<main id="view"></main>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="delDlg" aria-labelledby="delTitle"><form method="dialog" id="delForm">
  <h2 id="delTitle">Delete data</h2><div id="delBody"></div>
  <label for="delUser">Your name or role (recorded in the audit log)</label><input id="delUser" required autocomplete="name">
  <label for="delReason">Reason (optional)</label><input id="delReason" placeholder="e.g. wrong file version loaded">
  <label for="delConfirm">Type <b id="delPhrase"></b> to confirm</label><input id="delConfirm" autocomplete="off" spellcheck="false">
  <div id="delErr" style="color:var(--critical);margin-top:8px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="plain" id="delCancel">Cancel</button><button type="button" class="danger" id="delGo" disabled>Delete permanently</button></div>
</form></dialog>


<script src="/static/amxg.js"></script>
<script src="/static/studio.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = v => v == null ? "—" : String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 1) => v == null ? "—" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d});
const dt = v => v ? new Date(v).toLocaleDateString(undefined, {day: "2-digit", month: "short", year: "numeric"}) : "—";
const md = v => v ? new Date(v).toLocaleDateString(undefined, {month: "2-digit", day: "2-digit"}) : "—";
const api = p => fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

// ---------- tooltip ----------
const tip = $("#tip");
function showTip(ev, value, rows) {
  tip.replaceChildren();
  const b = document.createElement("b"); b.textContent = value; tip.appendChild(b);
  rows.forEach(r => { const d = document.createElement("div"); d.textContent = r; tip.appendChild(d); });
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.style.display = "none";
function hover(node, value, rows) {
  node.setAttribute("tabindex", "0");
  node.addEventListener("pointermove", e => showTip(e, value, rows));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); showTip({clientX: r.right, clientY: r.top}, value, rows); });
  node.addEventListener("blur", hideTip);
}

// ---------- theme ----------
const setTheme = t => { document.documentElement.dataset.theme = t; $("#theme").textContent = t === "dark" ? "Dark mode" : "Paper"; localStorage.theme = t; route(); };
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
document.documentElement.dataset.theme = localStorage.theme || "light"; $("#theme").textContent = document.documentElement.dataset.theme === "dark" ? "Dark mode" : "Paper";

// ---------- alerts strip ----------
async function loadAlerts() {
  try { const a = await api("/api/maestro/alerts");
    $("#alerttext").innerHTML = `${a.total} alerts active <span class="n">· ${a.critical} critical / ${a.warning} warning ▾</span>`;
  } catch { $("#alerttext").textContent = "Alerts unavailable"; }
}

// ---------- views ----------
const MODULES = [
  ["M_01", "Event management", "Monitor supply chain events and logistical windows in real-time.", "#alerts"],
  ["M_02", "Supply analysis", "Supplier risk, network, single points of failure, stock coverage and mitigation.", "/supply"],
  ["M_03", "Tiered dashboards", "Gate and production-machine performance with trend and watch list.", "#machine"],
  ["M_04", "AMXG", "Aircraft Maintenance Cross-Group: events, timelines, docks, tiered dashboards, status report, machine health and concept boards.", "#amxg"],
  ["M_05", "Workflow engine", "Compose tasks into executable workflows; attach alert and simulation rules per node.", null],
  ["M_06", "Data curation", "Bronze → Silver → Gold governance: trust scores, quarantine, certified products.", "/governance"],
  ["M_07", "Configuration tool", "The one place data enters Maestro - upload files, link an ERP or API, stream IoT.", "#config"],
  ["M_08", "Reliability analysis", "Fleet health, subsystem scores and telemetry against limits.", "#fleet"],
  ["M_09", "AI/ML engine", "Reads any file layout and answers questions over your data.", null],
  ["M_10", "Maestro connect", "Link MRO / PLM / MES APIs; data fills the right modules by relevance.", null],
  ["M_11", "Workforce development", "Skills maturity, training wishes, and where to invest to grow the team.", null],
  ["M_12", "Admin console", "Users, groups, attribute hierarchy, and module assignment.", null],
  ["M_13", "Collaboration", "Unified secure workspace - notes, email, chat, calendar.", null],
  ["M_14", "Capacity planning", "Machine, labor, material, and tool load over time.", null],
];
function viewModules(v) {
  v.innerHTML = `<div class="titlebar"><div><div class="mono eyebrow">Operational framework</div><h1>MAESTRO COMPONENTS</h1></div>
    <div class="ready mono">System_readiness<b>NOMINAL</b></div></div><div class="grid4" id="mods"></div>`;
  $("#mods").innerHTML = MODULES.map(([id, t, d, href]) => `<a class="mod" ${href ? `href="${href}"` : ""}>
    <div class="ic">${id.slice(2)}</div><span class="id mono">${id}</span><h3>${esc(t)}</h3><p>${esc(d)}</p>
    <span class="badge ${href ? "live" : ""}">${href ? "LIVE" : "DESIGN"}</span></a>`).join("");
}

async function viewDocks(v) {
  const d = await api("/api/maestro/docks");
  v.innerHTML = `<div class="titlebar"><div><div class="mono eyebrow"><a href="#amxg" style="text-decoration:none">AMXG</a> // AMX_03</div><h1>DOCK OVERVIEW</h1>
    <div class="mono" style="color:var(--muted)">Status as of ${dt(d.as_of)} · ${d.aircraft.length} aircraft in work${d.trust ? ` · data trust <a href="/governance#drill?product=depot_flow&gold=1">${esc(d.trust.label)}</a>` : ""}</div></div></div><div class="docks" id="cards"></div>`;
  if (!d.aircraft.length) { $("#cards").outerHTML = await whyEmpty(["asset_flow", "gate_event"], "aircraft in work"); return; }
  $("#cards").innerHTML = d.aircraft.map(c => {
    const box = [["Day", c.day, c.day_goal ? c.day_goal : null, c.day_over], ["Flow", c.flow_days, c.amrep_days, c.flow_days > c.amrep_days],
                 ["InDock", c.in_dock_days, c.in_dock_goal, c.in_dock_days > c.in_dock_goal], ["Queue", c.queue_days, null, false]]
      .map(([l, a, b, o]) => `<span>${l}:</span><b class="${o ? "over" : ""}">${num(a, 0)}${b != null ? "/" + num(b, 0) : ""}</b>`).join("");
    const ms = c.milestones.map(m => `<div>${md(m.date)}<u>${esc(m.gate.toUpperCase())}</u></div>`).join("") || "<div>—</div>";
    const flags = [c.amrep_risk ? `<span class="tag critical">▲ AMREP RISK</span>` : "", c.day_over ? `<span class="tag warning">● OVER GATE GOAL</span>` : "",
                   c.data_quality ? `<span class="tag warning" title="${esc(c.data_quality)}">● DATA CHECK</span>` : ""].join(" ");
    return `<article class="dock"><div class="top"><div class="name">${esc(c.dock || "Off dock")}</div><div class="box">${box}</div></div>
      <div class="line"><a href="/governance#drill?asset=${encodeURIComponent(c.asset_id)}" title="Open this aircraft's records and lineage">${esc(c.asset_id)}</a> &nbsp; B-52H PDM &nbsp; ${esc(c.gate.toUpperCase())}</div>
      <div class="cols"><div class="ms">${ms}</div><div>
        <div class="mono" style="font-size:10px"><u>Next big thing</u></div><div>${esc(c.current_milestone || "—")}</div>
        <div class="mono" style="font-size:10px;margin-top:8px"><u>Known repairs / notes</u></div>
        <ul>${(c.notes.length ? c.notes : ["—"]).map(n => `<li>${esc(n)}</li>`).join("")}</ul>
        <div style="margin-top:8px;color:var(--ink2);font-size:12px">AMREP ${dt(c.amrep_date)} · projected ${dt(c.projected_finish)}</div></div></div>
      <div>${flags}</div></article>`;
  }).join("");
}

// Gate graph: stacked columns (actual + remaining), last-N average line, requirement line, WIP inset.
function gateChart(host, g) {
  const W = Math.max(host.clientWidth - 32, 480), H = 320, m = {t: 16, r: 120, b: 44, l: 40};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = g.bars.length;
  const maxV = niceMax(Math.max(1, ...g.bars.map(b => b.total_days), g.requirement || 0, ...g.bars.map(b => b.last_n_avg || 0)) * 1.08);
  const y = v => m.t + ih - (v / maxV) * ih, band = iw / Math.max(n, 1), bw = Math.min(24, band * 0.6), cx = i => m.l + band * i + band / 2;
  const svg = el("svg", {width: W, height: H, role: "img", "aria-label": `${g.subtitle} gate graph`});
  for (let i = 0; i <= 4; i++) { const v = maxV * i / 4, yy = y(v);
    el("line", {x1: m.l, x2: m.l + iw, y1: yy, y2: yy, stroke: i ? css("--grid") : css("--axis"), "stroke-width": 1}, svg);
    el("text", {x: m.l - 6, y: yy + 4, "text-anchor": "end"}, svg).textContent = num(v, 0); }
  const split = g.bars.findIndex(b => b.in_work);
  if (split > 0) el("line", {x1: m.l + band * split, x2: m.l + band * split, y1: m.t, y2: m.t + ih, stroke: css("--axis"), "stroke-width": 1}, svg);
  const bar = (x, y0, y1, color, roundTop) => { const h = Math.max(y0 - y1, 0); if (h <= 0) return null;
    const r = Math.min(4, h, bw / 2);
    const d = roundTop ? `M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z` : `M${x},${y0} V${y1} H${x + bw} V${y0} Z`;
    return el("path", {d, fill: color}, svg); };
  g.bars.forEach((b, i) => {
    const x = cx(i) - bw / 2, hasRem = b.remaining_days > 0;
    bar(x, y(0), y(b.actual_days) + (hasRem ? 0 : 0), css("--s1"), !hasRem);
    if (hasRem) bar(x, y(b.actual_days) - 2, y(b.total_days), css("--s1-light"), true);
    const hit = el("rect", {x: cx(i) - band / 2, y: m.t, width: band, height: ih, fill: "transparent", style: "cursor:pointer"}, svg);
    hit.addEventListener("click", () => location.href = "/governance#drill?asset=" + encodeURIComponent(b.asset_id));
    hover(hit, `${num(b.actual_days, 0)} days`, [b.asset_id + (b.in_work ? " · in gate now" : ""),
      b.in_work ? `Remaining ${num(b.remaining_days, 0)} · total ${num(b.total_days, 0)}` : `Finished ${dt(b.finished)}`,
      b.last_n_avg != null ? `Last ${g.last_n} avg ${num(b.last_n_avg)}` : `Requirement ${num(b.requirement, 0)}`, "Click to drill into this aircraft's records"]);
    const t = el("text", {x: cx(i), y: m.t + ih + 16, "text-anchor": "middle"}, svg); t.textContent = b.asset_id;
    if (b.in_work) { const s = el("text", {x: cx(i), y: m.t + ih + 30, "text-anchor": "middle"}, svg); s.textContent = "in work"; }
  });
  // last-N average line over completed bars
  const pts = g.bars.map((b, i) => b.last_n_avg != null ? [cx(i), y(b.last_n_avg)] : null).filter(Boolean);
  if (pts.length) {
    el("path", {d: "M" + pts.map(p => p.join(",")).join(" L"), fill: "none", stroke: css("--s2"), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}, svg);
    const [lx, ly] = pts[pts.length - 1];
    el("circle", {cx: lx, cy: ly, r: 4, fill: css("--s2"), stroke: css("--surface"), "stroke-width": 2}, svg);
  }
  if (g.requirement != null) {
    el("line", {x1: m.l, x2: m.l + iw, y1: y(g.requirement), y2: y(g.requirement), stroke: css("--s3"), "stroke-width": 2}, svg);

  return svg;
}

function wipChart(w) {
  const W = 150, H = 200, m = {t: 18, b: 34, l: 28}, ih = H - m.t - m.b;
  const maxV = niceMax(Math.max(w.plan || 0, w.actual, 1) * 1.15), y = v => m.t + ih - (v / maxV) * ih;
  const svg = el("svg", {width: W, height: H, role: "img", "aria-label": `WIP plan ${w.plan}, actual ${w.actual}`});
  el("line", {x1: m.l, x2: W - 6, y1: y(0), y2: y(0), stroke: css("--axis")}, svg);
  const col = (x, v, color, over) => { if (!v) return;
    const top = y(v), h = y(0) - top; el("path", {d: `M${x},${y(0)} V${top + Math.min(4, h)} Q${x},${top} ${x + 4},${top} H${x + 20} Q${x + 24},${top} ${x + 24},${top + Math.min(4, h)} V${y(0)} Z`, fill: color}, svg); };
  const plan = w.plan || 0, within = Math.min(w.actual, plan || w.actual), over = Math.max(w.actual - plan, 0);
  col(m.l + 10, plan, css("--s1-light"));
  col(m.l + 66, within, css("--s1-light"));
  if (over > 0 && w.plan != null) { const top = y(w.actual), base = y(plan) - 2; el("path", {d: `M${m.l + 66},${base} V${top + 4} Q${m.l + 66},${top} ${m.l + 70},${top} H${m.l + 86} Q${m.l + 90},${top} ${m.l + 90},${top + 4} V${base} Z`, fill: css("--critical")}, svg); }
  [[m.l + 22, plan, "Plan"], [m.l + 78, w.actual, "Actual"]].forEach(([x, v, l]) => {
    el("text", {x, y: y(0) + 14, "text-anchor": "middle"}, svg).textContent = l;

function machineChart(host, m) {
  const W = Math.max(host.clientWidth - 32, 560), H = 320, mg = {t: 16, r: 16, b: 52, l: 40}, iw = W - mg.l - mg.r, ih = H - mg.t - mg.b;
  const n = m.gates.length, maxV = niceMax(Math.max(...m.gates.map(g => Math.max(g.last_n_avg, g.requirement))) * 1.1);
  const y = v => mg.t + ih - (Math.max(v, 0) / maxV) * ih, band = iw / n, bw = Math.min(24, band * .55), cx = i => mg.l + band * i + band / 2;
  const svg = el("svg", {width: W, height: H, role: "img", "aria-label": "Production machine last-N average days per gate"});
  for (let i = 0; i <= 4; i++) { const v = maxV * i / 4; el("line", {x1: mg.l, x2: mg.l + iw, y1: y(v), y2: y(v), stroke: i ? css("--grid") : css("--axis")}, svg);
    el("text", {x: mg.l - 6, y: y(v) + 4, "text-anchor": "end"}, svg).textContent = num(v, 0); }
  m.gates.forEach((g, i) => { const x = cx(i) - bw / 2, top = y(g.last_n_avg), h = y(0) - top, r = Math.min(4, h);
    if (h > 0) el("path", {d: `M${x},${y(0)} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${y(0)} Z`, fill: g.is_queue ? css("--s2") : css("--s1")}, svg);
    if (g.requirement > 0) el("line", {x1: cx(i) - bw / 2 - 6, x2: cx(i) + bw / 2 + 6, y1: y(g.requirement), y2: y(g.requirement), stroke: css("--s3"), "stroke-width": 2, "stroke-linecap": "round"}, svg);
    el("text", {x: cx(i), y: top - 6, "text-anchor": "middle", class: "lab"}, svg).textContent = num(g.last_n_avg);
    const words = g.gate.replace("Queue to ", "Q→ ").split(" "); words.forEach((w, k) => el("text", {x: cx(i), y: mg.t + ih + 14 + k * 12, "text-anchor": "middle"}, svg).textContent = w);
    hover(el("rect", {x: cx(i) - band / 2, y: mg.t, width: band, height: ih, fill: "transparent"}, svg), `${num(g.last_n_avg)} days`, [g.gate, `Requirement ${num(g.requirement, 0)}`, `WIP ${g.wip.actual}${g.wip.plan != null ? " / plan " + g.wip.plan : ""}`]);
  });
  return svg;
}

function telemetryChart(host, s) {
  const W = Math.max(host.clientWidth - 32, 420), H = 200, m = {t: 12, r: 90, b: 26, l: 48}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const pts = s.points.filter(p => p.v != null && p.t), vals = pts.map(p => p.v).concat(pts.map(p => p.hi).filter(x => x != null), pts.map(p => p.lo).filter(x => x != null));
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * .1 || 1, y0 = lo - pad, y1 = hi + pad;
  const t0 = new Date(pts[0].t).getTime(), t1 = new Date(pts[pts.length - 1].t).getTime() || t0 + 1;
  const x = t => m.l + ((new Date(t).getTime() - t0) / Math.max(t1 - t0, 1)) * iw, y = v => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const svg = el("svg", {width: W, height: H, role: "img", "aria-label": `${s.sensor} telemetry`});
  [y0, (y0 + y1) / 2, y1].forEach((v, i) => { el("line", {x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: i ? css("--grid") : css("--axis")}, svg);
    el("text", {x: m.l - 6, y: y(v) + 4, "text-anchor": "end"}, svg).textContent = num(v, 0); });
  const last = pts[pts.length - 1];
  [["hi", "High limit"], ["lo", "Low limit"]].forEach(([k, l]) => { if (last[k] == null) return;
    el("line", {x1: m.l, x2: m.l + iw, y1: y(last[k]), y2: y(last[k]), stroke: css("--critical"), "stroke-width": 1}, svg);
    el("text", {x: m.l + iw + 6, y: y(last[k]) + 4, class: "lab"}, svg).textContent = `${l} ${num(last[k], 0)}`; });
  el("path", {d: "M" + pts.map(p => `${x(p.t)},${y(p.v)}`).join(" L"), fill: "none", stroke: css("--s1"), "stroke-width": 2, "stroke-linejoin": "round"}, svg);
  el("circle", {cx: x(last.t), cy: y(last.v), r: 4, fill: css("--s1"), stroke: css("--surface"), "stroke-width": 2}, svg);
  const cross = el("line", {y1: m.t, y2: m.t + ih, stroke: css("--axis"), visibility: "hidden"}, svg);
  const hit = el("rect", {x: m.l, y: m.t, width: iw, height: ih, fill: "transparent"}, svg);
  hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(), px = e.clientX - r.left;
    const p = pts.reduce((a, b) => Math.abs(x(b.t) - px) < Math.abs(x(a.t) - px) ? b : a);
    cross.setAttribute("x1", x(p.t)); cross.setAttribute("x2", x(p.t)); cross.setAttribute("visibility", "visible");
    showTip(e, num(p.v), [s.sensor, new Date(p.t).toLocaleString()]); });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  return svg;
}

      <div id="sources"></div></div>
    <div class="panel"><h2 class="mono">Recent loads</h2><div id="recent"></div>
      <p style="color:var(--ink2);font-size:13px;margin-bottom:0">Quality, quarantine and lineage for every load: <a href="/governance">Data governance</a>.</p></div>
    <div class="panel"><h2 class="mono">Ask Maestro · AI/ML engine</h2><form id="ask" class="row"><input id="q" style="flex:1" placeholder="e.g. Which aircraft are at risk of missing AMREP and which gate is the constraint?"><button>Ask</button></form><div id="ans" style="margin-top:10px"></div></div>`;
  const recent = async () => {
    const bs = (await api("/api/governance/batches")).slice(0, 25);
    $("#recent").innerHTML = bs.length ? `<table><tr><th>Loaded</th><th>Source</th><th>Sheet</th><th>Read as</th><th class="n">Records</th><th>Shows in</th></tr>${bs.map(b => `<tr><td>${dt(b.received_at)}</td><td>${esc(b.source_id)}</td><td>${esc(b.sheet)}</td>
      <td>${b.gate1 && b.gate1.status === "blocked" ? '<span class="tag critical">▲ BLOCKED</span>' : esc(b.record_type)}</td><td class="n">${num(b.stored, 0)}</td><td>${b.gate1 && b.gate1.status === "blocked" ? `<a href="/governance#batch?id=${b.batch_id}">why?</a>` : destLink(b.record_type)}</td></tr>`).join("")}</table>`
      : '<p class="empty">Nothing loaded yet.</p>';
  };
  const row = (name, b) => `<tr><td>${esc(name)}${b.sheet ? " / " + esc(b.sheet) : ""}</td><td>${b.error ? '<span class="tag critical">▲ ERROR</span>' : b.blocked ? '<span class="tag critical">▲ BLOCKED</span>' : esc(b.record_type || b.document_kind || "")}${b.template ? ` <span class="tag good">${esc(b.template)}</span>` : ""}</td>
    <td class="n">${num(b.records, 0)}</td><td>${b.records ? destLink(b.record_type) : "—"}</td><td style="color:var(--ink2)">${esc(b.error || b.note || "")}</td></tr>`;
  $("#uname").value = localStorage.amxUser || "";
  // Files go up one at a time into one batch, so the bar shows real progress: each file is
  // half upload (bytes sent) and half reading on the server (profiling, classifying, mapping).
  const send = (url, fd, onUp) => new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open("POST", url);
    x.upload.onprogress = e => { if (e.lengthComputable) onUp(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {}
      x.status < 300 ? res(j) : rej(new Error(j.detail || `HTTP ${x.status}`)); };
    x.onerror = () => rej(new Error("network error")); x.send(fd); });
  $("#up").onclick = async () => {
    const files = [...$("#files").files]; if (!files.length) { $("#loadMsg").innerHTML = '<p style="color:var(--critical)">Choose one or more files first.</p>'; return; }
    const user = $("#uname").value.trim(); if (!user) { $("#loadMsg").innerHTML = '<p style="color:var(--critical)">Enter your name or role (it is recorded with every decision).</p>'; $("#uname").focus(); return; }
    localStorage.amxUser = user;
    const n = files.length, mode = $("#review").checked ? "review" : "auto";
    $("#up").disabled = true; $("#files").disabled = true;
    $("#loadMsg").innerHTML = `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span id="pgText">Starting…</span><b id="pgPct">0%</b></div>
      <div role="progressbar" aria-label="Loading files" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pgBar"
        style="height:10px;background:color-mix(in srgb, var(--s1) 18%, transparent);border-radius:5px;overflow:hidden;margin-top:6px">
        <i id="pgFill" style="display:block;height:100%;width:0;background:var(--s1);border-radius:5px;transition:width .2s"></i></div>
      <ul id="pgList" style="margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--ink2)"></ul></div>`;
    const set = (done, part, text) => { const pct = Math.min(100, Math.round(100 * (done + part) / n));
      $("#pgFill").style.width = pct + "%"; $("#pgPct").textContent = pct + "%"; $("#pgBar").setAttribute("aria-valuenow", pct); if (text) $("#pgText").textContent = text; };
    let batchId = null, failed = 0;
    for (let i = 0; i < n; i++) {
      const f = files[i], fd = new FormData(); fd.append("files", f);
      const label = `File ${i + 1} of ${n}: ${f.name}`;
      if (!batchId) { fd.append("user", user); fd.append("mode", mode); fd.append("name", n === 1 ? f.name : `${n} files · ${new Date().toLocaleString()}`); }
      set(i, 0, label + " · uploading");
      try {
        const j = await send(batchId ? `/api/batches/${batchId}/files` : "/api/batches", fd,
                             frac => set(i, frac * 0.5, label + (frac < 1 ? ` · uploading ${Math.round(frac * 100)}%` : " · reading")));
        batchId = batchId || j._id;
        const r = (j.load || [])[0] || {}, sheets = (r.results || []).length;
        if (r.error) { failed++; $("#pgList").insertAdjacentHTML("beforeend", `<li style="color:var(--critical)">✗ ${esc(f.name)}: ${esc(r.error)}</li>`); }
        else $("#pgList").insertAdjacentHTML("beforeend", `<li>✓ ${esc(f.name)}${sheets > 1 ? ` · ${sheets} tables` : ""}</li>`);
      } catch (e) { failed++; $("#pgList").insertAdjacentHTML("beforeend", `<li style="color:var(--critical)">✗ ${esc(f.name)}: ${esc(e.message)}</li>`); }
      set(i + 1, 0);
    }
    $("#up").disabled = false; $("#files").disabled = false;
    $("#pgText").textContent = `Done: ${n - failed} of ${n} file(s) read${failed ? `, ${failed} failed` : ""}`;
    loadAlerts();
    if (batchId) { $("#pgList").insertAdjacentHTML("afterend", `<p style="margin:8px 0 0"><a href="#batch/${batchId}">Open the batch →</a></p>`);
      if (!failed) setTimeout(() => { location.hash = "#batch/" + batchId; }, 900); }
  };
  (async () => { const bs = (await api("/api/batches")).slice(0, 8);
    $("#batchList").innerHTML = bs.length ? `<table><tr><th>Batch</th><th>Loaded</th><th>By</th><th class="n">Sources</th><th class="n">Rows</th><th>Status</th><th></th></tr>${bs.map(b => `<tr>
      <td><a href="#batch/${b._id}">${esc(b.name)}</a></td><td>${dt(b.created_at)}</td><td>${esc(b.created_by)}</td><td class="n">${b.objects}</td><td class="n">${num(b.rows, 0)}</td>
      <td>${Object.entries(b.counts).map(([k, n]) => `<span class="tag ${k === "PUBLISHED" ? "good" : k === "READY" ? "" : "warning"}">${n} ${esc(k.replace("_", " ").toLowerCase())}</span>`).join(" ")}</td>
      <td style="white-space:nowrap"><a class="tag" style="color:var(--accent);text-decoration:none" href="#batch/${b._id}">Open</a>
        ${b.counts.READY ? `<button class="plain" data-bpub="${b._id}" title="Validate, govern and publish the ready tables" style="padding:3px 8px;font-size:10px">Publish ${b.counts.READY} ready</button>` : ""}
        <button class="plain" data-bdel="${b._id}" style="padding:3px 8px;font-size:10px;color:var(--critical)">Delete…</button></td></tr>`).join("")}</table><div id="batchMsg"></div>` : "";
    document.querySelectorAll("[data-bdel]").forEach(x => x.onclick = () => window.confirmLoadedDelete("batch", x.dataset.bdel, () => route()));
    document.querySelectorAll("[data-bpub]").forEach(x => x.onclick = async () => {
      x.disabled = true; x.textContent = "Publishing…";
      try { const r = await window.publishTables(x.dataset.bpub, null); if (!r) { x.disabled = false; return; }
        $("#batchMsg").innerHTML = `<p style="color:${r.status === "FAILED" ? "var(--critical)" : "var(--good)"}">Run ${esc(r.status.toLowerCase())}: ${num(r.records || 0, 0)} records. <a href="#batch/${x.dataset.bpub}">See the stages</a></p>`; x.remove(); }
      catch (e) { $("#batchMsg").innerHTML = `<p style="color:var(--critical)">${esc(e.message)}</p>`; x.disabled = false; } }); })();
  $("#apiForm").onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const body = {url: f.url, kind: f.kind, source: f.source || null, records_path: f.records_path || null, username: f.username || null,
      password: f.password || null, headers: f.token ? {Authorization: "Bearer " + f.token} : {}};
    $("#apiOut").textContent = "Pulling…";
    const r = await fetch("/api/ingest/api", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); const j = await r.json();
    $("#apiOut").innerHTML = r.ok ? `✓ ${num(j.records, 0)} ${esc(j.record_type)} records from ${j.pages} page(s) ${destLink(j.record_type)}` : `✗ ${esc(j.detail)}`; recent(); loadAlerts(); };
  $("#ask").onsubmit = async e => { e.preventDefault(); $("#ans").textContent = "Thinking…";
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: $("#q").value})}); const j = await r.json();
    if (!r.ok) { $("#ans").textContent = j.detail; return; }
    const list = (t, xs) => xs && xs.length ? `<p class="mono" style="margin:10px 0 4px">${t}</p><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    const g = (j.decision || {}).gate || {};
    $("#ans").innerHTML = `<p class="mono" style="color:var(--accent)">${esc((g.verdict || "").replaceAll("_", " "))} · ${esc(g.reason || "")} · <a href="/governance#overview">review in governance</a></p><p>${esc(j.answer)}</p>` + list("Key findings", j.key_findings) + list("Recommended actions", j.recommended_actions); };
  const sources = async () => {
    const ss = await api("/api/data/sources");
    $("#sources").innerHTML = ss.length ? `<table><tr><th>Source</th><th>Contains</th><th class="n">Records</th><th class="n">Loads</th><th>Last loaded</th><th></th></tr>${ss.map(x => `<tr>
      <td>${esc(x.source_id)}${x.files ? "" : ' <span style="color:var(--muted)">(API / IoT)</span>'}</td>
      <td>${esc(x.entities.join(", ") || "—")}${x.sheets.length ? `<div style="color:var(--muted);font-size:12px">${esc(x.sheets.slice(0, 6).join(", "))}${x.sheets.length > 6 ? ` +${x.sheets.length - 6} more` : ""}</div>` : ""}</td>
      <td class="n">${num(x.records, 0)}${x.by_layer.history || x.by_layer.duplicate ? `<div style="color:var(--muted);font-size:12px">${num((x.by_layer.history || 0) + (x.by_layer.duplicate || 0), 0)} superseded</div>` : ""}</td>
      <td class="n">${x.batches}</td><td>${dt(x.last_loaded)}</td>
      <td><button class="plain" data-del="${esc(x.source_id)}">Delete…</button></td></tr>`).join("")}</table>` : '<p class="empty">No data loaded.</p>';
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmDelete(b.dataset.del));
  };
  const confirmDelete = async source => {
    const pv = await api("/api/data/delete-preview" + (source ? "?source=" + encodeURIComponent(source) : ""));
    const dlg = $("#delDlg");
    $("#delTitle").textContent = source ? `Delete "${source}"?` : "Delete ALL loaded data?";
    $("#delBody").innerHTML = `<p>This permanently removes:</p><ul><li>${num(pv.records, 0)} records (Silver, Gold, history)</li><li>${num(pv.batches, 0)} load${pv.batches === 1 ? "" : "s"} and ${num(pv.files, 0)} original file${pv.files === 1 ? "" : "s"} from Bronze</li>
      <li>${num(pv.quarantine_items, 0)} quarantine item(s)</li></ul>
      ${pv.products_affected.length ? `<p>Affected Gold products (their certification is withdrawn and must be renewed): <b>${esc(pv.products_affected.join(", "))}</b></p>` : ""}
      ${source ? "<p style='color:var(--ink2);font-size:13px'>If an older load of the same records exists, it becomes the current version again.</p>" : ""}`;
    $("#delPhrase").textContent = pv.confirm_with; $("#delConfirm").value = ""; $("#delErr").textContent = "";
    $("#delUser").value = localStorage.govUser || ""; $("#delReason").value = "";
    const check = () => $("#delGo").disabled = !($("#delConfirm").value.trim() === pv.confirm_with && $("#delUser").value.trim());
    $("#delConfirm").oninput = check; $("#delUser").oninput = check; check();
    $("#delCancel").onclick = () => dlg.close();
    $("#delGo").onclick = async () => {
      $("#delGo").disabled = true; $("#delGo").textContent = "Deleting…";
      const url = source ? `/api/data/sources/${encodeURIComponent(source)}/delete` : "/api/data/delete-all";
      const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({confirm: $("#delConfirm").value.trim(), user: $("#delUser").value.trim(), reason: $("#delReason").value})});
      const j = await r.json(); $("#delGo").textContent = "Delete permanently";
      if (!r.ok) { $("#delErr").textContent = j.detail; check(); return; }
      localStorage.govUser = $("#delUser").value.trim(); dlg.close();
      $("#apiOut").innerHTML = ""; sources(); recent(); loadAlerts();
    };
    dlg.showModal(); $("#delConfirm").focus();
  };
  $("#delAll").onclick = () => confirmDelete(null);
  let feedTimer;
  const feeds = async () => {
    const f = await api("/api/feeds"); clearTimeout(feedTimer);
    $("#feedsAll").disabled = f.running; $("#feedsAll").textContent = f.running ? "Refreshing…" : "Refresh now";
    $("#feeds").innerHTML = `<p class="mono" style="color:var(--muted);font-size:11px">${f.schedule.enabled ? `Daily at ${String(f.schedule.hour_utc).padStart(2, "0")}:00 UTC` : "Daily schedule off (RISK_FEEDS_ENABLED=false)"}</p>
      <table><tr><th>Feed</th><th>Publisher</th><th>Sends out</th><th>Last run</th><th>Status</th><th class="n">Signals</th><th>On</th><th></th></tr>${f.feeds.map(x => `<tr>
      <td>${esc(x.name)}<div style="color:var(--muted);font-size:12px">${esc(x.category)} · ${esc(x.cadence)}</div></td><td style="font-size:12.5px">${esc(x.publisher)}</td><td style="font-size:12.5px;color:var(--ink2)">${esc(x.sends)}</td>
      <td>${x.last_run ? dt(x.last_run) : "—"}</td><td>${x.status === "ok" ? '<span class="tag good">✓ OK</span>' : x.status === "partial" ? `<span class="tag warning">● PARTIAL</span><div style="font-size:11px;color:var(--ink2);max-width:260px">${esc(x.error)}</div>` : x.status === "error" ? `<span class="tag critical" title="${esc(x.error)}">▲ ERROR</span><div style="font-size:11px;color:var(--ink2);max-width:260px">${esc(x.error)}</div>` : esc(x.status)}</td>
      <td class="n">${num(x.signals, 0)}</td><td><input type="checkbox" data-feed="${x.id}" ${x.enabled ? "checked" : ""} aria-label="Enable ${esc(x.name)}"></td>
      <td><button class="plain" data-run="${x.id}" ${f.running || !x.enabled ? "disabled" : ""}>Run</button></td></tr>`).join("")}</table>`;
    document.querySelectorAll("[data-feed]").forEach(c => c.onchange = async () => { const u = localStorage.govUser || prompt("Your name or role (recorded):"); if (!u) { c.checked = !c.checked; return; }
      localStorage.govUser = u; await api(`/api/feeds/${c.dataset.feed}`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled: c.checked, user: u})}); feeds(); });
    document.querySelectorAll("[data-run]").forEach(b => b.onclick = async () => { await api(`/api/feeds/${b.dataset.run}/run`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: localStorage.govUser || "manual"})}); feeds(); });
    if (f.running) feedTimer = setTimeout(() => { if (location.hash.startsWith("#config")) feeds(); }, 4000);
  };
  $("#feedsAll").onclick = async () => { await api("/api/feeds/run-all", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user: localStorage.govUser || "manual"})}); feeds(); };
  feeds();
  sources();
  recent();
  const reload = $("#up").onclick; $("#up").onclick = async () => { await reload(); sources(); };
}

async function whyEmpty(entities, what) {
  let d; try { d = await api("/api/governance/diagnose?entities=" + entities.join(",")); } catch { d = {reasons: []}; }
  const prods = {asset_flow: "depot_flow", gate_event: "depot_flow", asset_status: "fleet_health", inventory: "inventory_position"};
  const pid = prods[entities[0]] || "";
  return `<div class="panel" style="border-color:var(--warning)"><h2 class="mono">No ${esc(what)} in Gold</h2>
    <p>This module reads only governed Gold data (grade A/B, not quarantined).</p>
    <ul>${(d.reasons.length ? d.reasons : ["No matching records have been loaded yet."]).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${d.layers && Object.keys(d.layers).length ? `<p class="mono" style="color:var(--ink2)">Loaded: ${Object.entries(d.layers).map(([k, n]) => `${n} ${esc(k)}`).join(" · ")}</p>` : ""}
    <div class="row"><a class="tag" style="color:var(--accent)" href="/governance#drill?product=${pid}">Drill into the records</a>
    <a class="tag" style="color:var(--accent)" href="/governance#batches">See how each sheet was read</a>
    <a class="tag" style="color:var(--accent)" href="#config">Load data in Configuration</a></div></div>`;
}

const VIEWS = {...(window.AMXG_VIEWS || {}), ...(window.STUDIO_VIEWS || {}), modules: viewModules, supply: () => { location.href = "/supply"; }, docks: viewDocks, gates: viewGates, machine: viewMachine, fleet: viewFleet, alerts: viewAlerts, config: viewConfig, data: viewConfig};
async function route() {
  const key = (location.hash.slice(1).split(/[/?]/)[0]) || "modules";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + key || (a.getAttribute("href") === "#amxg" && key.startsWith("amxg-")) || (a.getAttribute("href") === "#config" && (key === "batch" || key === "studio"))));
  const v = $("#view"); hideTip();
  try { await (VIEWS[key] || viewModules)(v); } catch (e) { v.innerHTML = `<p class="empty">Could not load this view (${esc(e.message)}).</p>`; }
}
$("#search").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) location.hash = "#fleet/" + encodeURIComponent(e.target.value.trim()); });
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#search").focus(); } });
addEventListener("hashchange", route);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(route, 200); });
loadAlerts(); route();
</script>
</body>
</html>
